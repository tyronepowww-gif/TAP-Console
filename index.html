<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TAP Core V2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#111;
  color:#eee;
  font-family:monospace;
}

body{
  display:flex;
  justify-content:center;
  padding:16px;
}

#app{
  width:min(430px,100%);
}

h1{
  text-align:center;
  margin:4px 0 12px;
  font-size:20px;
  letter-spacing:3px;
}

.device{
  background:#202020;
  border:2px solid #444;
  border-radius:28px;
  padding:18px;
  box-shadow:0 15px 45px #000;
}

.screen{
  min-height:250px;
  background:#cfd7c3;
  color:#172016;
  border:8px solid #111;
  border-radius:10px;
  padding:18px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:15px;
  line-height:1.35;
  box-shadow:inset 0 0 20px #0004;
}

.status{
  text-align:center;
  min-height:16px;
  margin:8px 0;
  font-size:11px;
  color:#aaa;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:14px;
}

button{
  min-height:58px;
  border:2px solid #555;
  border-radius:50%;
  background:#333;
  color:#fff;
  font-family:monospace;
  font-size:9px;
  font-weight:bold;
  padding:3px;
  overflow:hidden;
}

button:active{
  transform:scale(.94);
  background:#555;
}

.system{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.system button{
  min-height:42px;
  border-radius:8px;
  font-size:11px;
}

.panel{
  background:#181818;
  border:1px solid #333;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
}

.panel input,
.panel textarea{
  width:100%;
  background:#090909;
  color:#fff;
  border:1px solid #555;
  border-radius:7px;
  padding:10px;
  font-family:monospace;
  margin-bottom:8px;
}

.panel textarea{
  min-height:150px;
  resize:vertical;
}

.panel button{
  width:100%;
  min-height:42px;
  border-radius:7px;
  margin-top:5px;
}

.hidden{
  display:none;
}

.small{
  font-size:10px;
  color:#999;
  line-height:1.4;
  margin-top:8px;
}

.ok{
  color:#9f9;
  white-space:pre-wrap;
}

.err{
  color:#f88;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div id="app">

<h1>TAP CORE V2</h1>

<div class="device">

  <div id="screen" class="screen">
    BOOTING TAP...
  </div>

  <div id="status" class="status"></div>

  <div id="buttons" class="buttons">

    <button data-i="0">—</button>
    <button data-i="1">—</button>
    <button data-i="2">—</button>
    <button data-i="3">—</button>
    <button data-i="4">—</button>

  </div>

  <div class="system">

    <button id="homeBtn">
      HOME
    </button>

    <button id="powerBtn">
      POWER
    </button>

  </div>

</div>


<div class="panel">

  <button id="openImport">
    IMPORT CARTRIDGE
  </button>

  <div id="importPanel" class="hidden">

    <input
      id="cartName"
      maxlength="24"
      placeholder="Cartridge name">

    <textarea
      id="cartCode"
      placeholder="Paste cartridge JavaScript here"></textarea>

    <button id="installBtn">
      VALIDATE + INSTALL
    </button>

    <div class="small">
      Cartridge code executes through the TAP API.
      Browser prototype only — import code you trust.
    </div>

    <div id="importResult"></div>

  </div>

</div>


<script>

/* =========================================================
   TAP STORAGE
========================================================= */

class TAPStorage{

  constructor(){

    this.data={};

    try{

      const raw=
        localStorage.getItem("tap_storage");

      if(raw){

        this.data=
          JSON.parse(raw)||{};

      }

    }catch(error){

      this.data={};

    }

  }


  save(){

    try{

      localStorage.setItem(
        "tap_storage",
        JSON.stringify(this.data)
      );

    }catch(error){}

  }


  get(key){

    return this.data[key];

  }


  set(key,value){

    this.data[key]=value;

    this.save();

  }


  remove(key){

    delete this.data[key];

    this.save();

  }


  clear(){

    this.data={};

    this.save();

  }

}


/* =========================================================
   TAP HAL
   Physical hardware abstraction
========================================================= */

class TAPHAL{

  constructor(){

    this.buttons=[
      document.querySelector('[data-i="0"]'),
      document.querySelector('[data-i="1"]'),
      document.querySelector('[data-i="2"]'),
      document.querySelector('[data-i="3"]'),
      document.querySelector('[data-i="4"]')
    ];

    this.handlers=[
      null,
      null,
      null,
      null,
      null
    ];

    this.labels=[
      "—",
      "—",
      "—",
      "—",
      "—"
    ];

    this.bindEvents();

  }


  bindEvents(){

    this.buttons.forEach(
      (button,index)=>{

        button.addEventListener(
          "click",
          ()=>{

            const fn=
              this.handlers[index];

            if(typeof fn==="function"){

              fn();

            }

          }
        );

      }
    );


    document.addEventListener(
      "keydown",
      event=>{

        const number=
          parseInt(event.key,10);

        if(
          number>=1 &&
          number<=5
        ){

          this.press(number-1);

        }

      }
    );

  }


  setButton(index,label,handler){

    if(
      index<0 ||
      index>4
    ){

      return;

    }


    this.labels[index]=
      label || "—";


    this.handlers[index]=
      typeof handler==="function"
      ? handler
      : ()=>{};


    this.buttons[index].textContent=
      this.labels[index];

  }


  clearButtons(){

    for(
      let i=0;
      i<5;
      i++
    ){

      this.labels[i]="—";

      this.handlers[i]=null;

      this.buttons[i].textContent=
        "—";

    }

  }


  press(index){

    if(
      index<0 ||
      index>4
    ){

      return;

    }


    const fn=
      this.handlers[index];

    if(typeof fn==="function"){

      fn();

    }

  }


  setDisplay(text){

    document
      .getElementById("screen")
      .textContent=
        String(text ?? "");

  }


  setStatus(text){

    document
      .getElementById("status")
      .textContent=
        String(text ?? "");

  }

}


/* =========================================================
   TAP CORE
========================================================= */

class TAPCore{

  constructor(){

    this.storage=
      new TAPStorage();

    this.hal=
      new TAPHAL();

    this.cartridges={};

    this.current=null;

    this.loadRegistry();

    this.home();

  }


  /* =======================================================
     REGISTRY
  ======================================================= */

  loadRegistry(){

    this.cartridges=
      this.storage.get(
        "cartridges"
      ) || {};

  }


  saveRegistry(){

    this.storage.set(
      "cartridges",
      this.cartridges
    );

  }


  /* =======================================================
     PHYSICAL INPUT SYSTEM
     
     IMPORTANT:
     Five buttons are physical slots.
     
     Cartridges NEVER create new physical buttons.
     They simply replace the mapping of the five slots.
  ======================================================= */


  clearButtons(){

    this.hal.clearButtons();

  }


  bindButton(
    index,
    label,
    callback
  ){

    if(
      index<0 ||
      index>4
    ){

      return false;

    }


    this.hal.setButton(
      index,
      label,
      callback
    );

    return true;

  }


  setButtons(buttons){

    /*
      Always replace ALL five mappings.

      This is the critical fix.
    */

    this.clearButtons();


    if(!Array.isArray(buttons)){

      return;

    }


    for(
      let i=0;
      i<5;
      i++
    ){

      const button=
        buttons[i];


      if(
        !button
      ){

        this.bindButton(
          i,
          "—",
          ()=>{}
        );

        continue;

      }


      this.bindButton(
        i,
        button.label || "—",
        typeof button.action==="function"
          ? button.action
          : ()=>{}
      );

    }

  }


  /* =======================================================
     CARTRIDGE CONTEXT
  ======================================================= */

  makeContext(name){

    const core=this;


    const dataKey=
      "cartridge_data_"+name;


    let cartridgeData=
      core.storage.get(dataKey)||{};


    function saveData(){

      core.storage.set(
        dataKey,
        cartridgeData
      );

    }


    const tap={

      version:"2.0",


      /* ---------------------------------------------------
         UI
      --------------------------------------------------- */

      ui:{

        screen(text){

          core.hal.setDisplay(
            text
          );

        },


        status(text){

          core.hal.setStatus(
            text
          );

        }

      },


      /* ---------------------------------------------------
         INPUT
      --------------------------------------------------- */

      input:{

        /*
          Clear all five physical slots.
        */

        clear(){

          core.clearButtons();

        },


        /*
          Legacy sequential API.

          Each call fills one physical slot.
          Maximum = five physical slots.
        */

        button(label,callback){

          if(
            !tap.__buttonIndex
          ){

            tap.__buttonIndex=0;

          }


          const index=
            tap.__buttonIndex;


          if(index>=5){

            throw new Error(
              "TAP has 5 physical buttons. "+
              "Use tap.input.clear() before "+
              "creating a new mapping."
            );

          }


          core.bindButton(
            index,
            label,
            callback
          );


          tap.__buttonIndex++;

        },


        /*
          Recommended API.

          Atomically replaces the entire
          five-button layout.
        */

        set(buttons){

          core.setButtons(
            buttons
          );

          /*
            Reset legacy cursor so that
            subsequent button() calls begin
            from the beginning.
          */

          tap.__buttonIndex=0;

        }

      },


      /* ---------------------------------------------------
         STORAGE
      --------------------------------------------------- */

      storage:{

        get(key){

          return cartridgeData[key];

        },


        set(key,value){

          cartridgeData[key]=value;

          saveData();

        },


        remove(key){

          delete cartridgeData[key];

          saveData();

        },


        clear(){

          cartridgeData={};

          saveData();

        }

      },


      /* ---------------------------------------------------
         NAVIGATION
      --------------------------------------------------- */

      navigation:{

        home(){

          core.home();

        }

      },


      /* ---------------------------------------------------
         SYSTEM
      --------------------------------------------------- */

      system:{

        exit(){

          core.home();

        },


        power(){

          core.powerCycle();

        }

      },


      /* ---------------------------------------------------
         TIME
      --------------------------------------------------- */

      time:{

        now(){

          return Date.now();

        },


        delay(ms,fn){

          return setTimeout(
            fn,
            ms
          );

        },


        interval(ms,fn){

          return setInterval(
            fn,
            ms
          );

        },


        cancel(id){

          clearTimeout(id);

          clearInterval(id);

        }

      },


      /* ---------------------------------------------------
         MESSAGE
      --------------------------------------------------- */

      message(text){

        core.hal.setStatus(
          text
        );

      },


      /* ---------------------------------------------------
         LAUNCH
      --------------------------------------------------- */

      onLaunch(fn){

        tap.__launch=fn;

      }

    };


    tap.__buttonIndex=0;


    return tap;

  }


  /* =======================================================
     VALIDATION
  ======================================================= */

  validate(name,code){

    if(
      typeof name!=="string" ||
      name.trim().length<1 ||
      name.trim().length>24
    ){

      throw new Error(
        "Cartridge name must be 1–24 characters."
      );

    }


    if(
      typeof code!=="string" ||
      !code.trim()
    ){

      throw new Error(
        "Cartridge code is empty."
      );

    }


    if(
      code.length>50000
    ){

      throw new Error(
        "Cartridge exceeds 50,000 characters."
      );

    }


    if(
      !code.includes(
        "tap.onLaunch"
      )
    ){

      throw new Error(
        "Cartridge must call tap.onLaunch()."
      );

    }


    try{

      /*
        Compile only.
        Do NOT execute.
      */

      new Function(
        "tap",
        code
      );

    }catch(error){

      throw new Error(
        "Syntax error: "+
        error.message
      );

    }

  }


  /* =======================================================
     INSTALL
  ======================================================= */

  install(name,code){

    name=
      name.trim();


    this.validate(
      name,
      code
    );


    this.cartridges[name]={

      name:name,

      code:code,

      builtin:false,

      installedAt:
        Date.now()

    };


    this.saveRegistry();

  }


  /* =======================================================
     LAUNCH
  ======================================================= */

  launch(name){

    const cartridge=
      this.cartridges[name];


    if(!cartridge){

      this.hal.setDisplay(
        "CARTRIDGE NOT FOUND\n\n"+
        name
      );

      return;

    }


    /*
      Kill previous physical mapping.
    */

    this.clearButtons();


    this.current=name;


    this.hal.setStatus(
      "RUNNING: "+name
    );


    try{

      const tap=
        this.makeContext(
          name
        );


      const program=
        new Function(
          "tap",
          cartridge.code
        );


      /*
        Execute cartridge.
      */

      program(tap);


      if(
        typeof tap.__launch!=="function"
      ){

        throw new Error(
          "Cartridge did not register "+
          "tap.onLaunch()."
        );

      }


      /*
        Execute lifecycle.
      */

      tap.__launch();


    }catch(error){

      this.clearButtons();


      this.hal.setDisplay(
        "CARTRIDGE ERROR\n\n"+
        name+
        "\n\n"+
        error.message
      );


      this.hal.setStatus(
        "ERROR"
      );

    }

  }


  /* =======================================================
     HOME
  ======================================================= */

  home(){

    this.current=null;

    this.clearButtons();


    this.hal.setStatus(
      "TAP CORE V2"
    );


    this.hal.setDisplay(
      "TAP CORE V2\n"+
      "────────────\n\n"+
      "CARTRIDGE COMPUTER\n\n"+
      "Choose a system."
    );


    this.setButtons([

      {
        label:"CART",
        action:()=>this.pick()
      },

      {
        label:"SET",
        action:()=>this.settings()
      },

      {
        label:"MANAGER",
        action:()=>this.manager()
      },

      {
        label:"—",
        action:()=>{}
      },

      {
        label:"—",
        action:()=>{}
      }

    ]);

  }


  /* =======================================================
     CARTRIDGE SELECT
  ======================================================= */

  pick(){

    const names=
      Object.keys(
        this.cartridges
      );


    if(
      names.length===0
    ){

      this.hal.setDisplay(
        "NO CARTRIDGES\n\n"+
        "Import one below."
      );


      this.setButtons([

        {
          label:"BACK",
          action:()=>this.home()
        },

        null,
        null,
        null,
        null

      ]);

      return;

    }


    const shown=
      names.slice(0,5);


    let text=
      "CARTRIDGES\n"+
      "────────────\n\n";


    shown.forEach(
      (name,index)=>{

        text+=
          (index+1)+
          " "+
          name+
          "\n";

      }
    );


    this.hal.setDisplay(
      text
    );


    this.setButtons(

      shown.map(
        name=>({

          label:name,

          action:()=>this.launch(name)

        })
      )

    );

  }


  /* =======================================================
     MANAGER
  ======================================================= */

  manager(){

    const names=
      Object.keys(
        this.cartridges
      );


    let text=
      "CARTRIDGE MANAGER\n"+
      "────────────────\n\n";


    if(names.length){

      text+=
        names
          .map(
            (n,i)=>
              (i+1)+" "+n
          )
          .join("\n");

    }else{

      text+="NO CARTRIDGES";

    }


    this.hal.setDisplay(
      text
    );


    this.setButtons([

      {
        label:"IMPORT",
        action:()=>this.openImport()
      },

      {
        label:"LAUNCH",
        action:()=>this.pick()
      },

      {
        label:"HOME",
        action:()=>this.home()
      },

      null,

      null

    ]);

  }


  /* =======================================================
     SETTINGS
  ======================================================= */

  settings(){

    this.hal.setDisplay(

      "SETTINGS\n"+
      "────────────\n\n"+
      "TAP CORE V2\n\n"+
      "5 physical buttons\n"+
      "Dynamic remapping\n"+
      "Persistent storage\n"+
      "50K cartridge limit\n"+
      "Contextual controls"

    );


    this.setButtons([

      {
        label:"RESTORE",
        action:()=>this.restoreDefaults()
      },

      {
        label:"WIPE",
        action:()=>this.confirmWipe()
      },

      {
        label:"HOME",
        action:()=>this.home()
      },

      null,

      null

    ]);

  }


  /* =======================================================
     POWER
  ======================================================= */

  powerCycle(){

    this.clearButtons();

    this.current=null;


    this.hal.setDisplay(
      "POWER CYCLE\n\n"+
      "RESTARTING..."
    );


    setTimeout(
      ()=>{
        this.home();
      },
      600
    );

  }


  /* =======================================================
     IMPORT PANEL
  ======================================================= */

  openImport(){

    document
      .getElementById(
        "importPanel"
      )
      .classList.remove(
        "hidden"
      );


    window.scrollTo({

      top:
        document.body.scrollHeight,

      behavior:"smooth"

    });

  }


  /* =======================================================
     WIPE
  ======================================================= */

  confirmWipe(){

    this.hal.setDisplay(

      "WIPE ALL DATA?\n\n"+
      "THIS REMOVES ALL\n"+
      "CARTRIDGES AND SAVES."

    );


    this.setButtons([

      {
        label:"YES",
        action:()=>{

          this.storage.clear();

          this.cartridges={};

          this.home();

        }
      },

      {
        label:"NO",
        action:()=>this.settings()
      },

      null,
      null,
      null

    ]);

  }


  /* =======================================================
     DEFAULT CARTRIDGE
  ======================================================= */

  restoreDefaults(){

    this.cartridges["TAP TEST"]={

      name:"TAP TEST",

      builtin:true,

      code:`

tap.onLaunch(()=>{

  let count=0;

  function draw(){

    tap.ui.screen(
      "TAP TEST\\n"+
      "────────\\n\\n"+
      "COUNT: "+count+
      "\\n\\n"+
      "Press TEST."
    );

  }


  tap.input.set([

    {
      label:"TEST",
      action:()=>{

        count++;

        draw();

      }
    },

    {
      label:"RESET",
      action:()=>{

        count=0;

        draw();

      }
    },

    {
      label:"HOME",
      action:()=>{

        tap.navigation.home();

      }
    },

    null,

    null

  ]);


  draw();

});

`

    };


    this.saveRegistry();


    this.hal.setDisplay(
      "DEFAULT RESTORED\n\n"+
      "TAP TEST installed."
    );


    this.setButtons([

      {
        label:"LAUNCH",
        action:()=>this.launch("TAP TEST")
      },

      {
        label:"HOME",
        action:()=>this.home()
      },

      null,
      null,
      null

    ]);

  }

}


/* =========================================================
   START TAP
========================================================= */

const TAP=
  new TAPCore();


/* =========================================================
   SYSTEM BUTTONS
========================================================= */

document
  .getElementById("homeBtn")
  .addEventListener(
    "click",
    ()=>TAP.home()
  );


document
  .getElementById("powerBtn")
  .addEventListener(
    "click",
    ()=>TAP.powerCycle()
  );


/* =========================================================
   IMPORT UI
========================================================= */

document
  .getElementById("openImport")
  .addEventListener(
    "click",
    ()=>TAP.openImport()
  );


document
  .getElementById("installBtn")
  .addEventListener(
    "click",
    ()=>{

      const name=
        document
          .getElementById(
            "cartName"
          )
          .value;


      const code=
        document
          .getElementById(
            "cartCode"
          )
          .value;


      const result=
        document
          .getElementById(
            "importResult"
          );


      try{

        TAP.install(
          name,
          code
        );


        result.className="ok";


        result.textContent=
          "IMPORT ✓\n"+
          "VALIDATE ✓\n"+
          "INSTALL ✓\n\n"+
          name+
          " is ready.\n"+
          "Nothing has executed yet.";


        document
          .getElementById(
            "cartName"
          )
          .value="";


        document
          .getElementById(
            "cartCode"
          )
          .value="";


      }catch(error){

        result.className="err";


        result.textContent=
          "IMPORT ✗\n\n"+
          error.message;

      }

    });


/* =========================================================
   DEFAULT BOOT
========================================================= */

if(
  Object.keys(
    TAP.cartridges
  ).length===0
){

  TAP.restoreDefaults();

}else{

  TAP.home();

}

</script>

</body>
</html>
